<body>

<div id="splash" class="gx" role="img" aria-label="Orbi">
  <div class="lockup"><span class="ring"></span><span class="word"></span></div>
  <div id="splash-err" class="errbox" hidden>
    <p id="splash-err-text"></p>
    <button class="abtn primary" id="splash-retry" style="width:auto;padding:0 28px">Try again</button>
  </div>
</div>

<main id="auth" class="gx" hidden>
  <div class="auth-inner">
    <div class="lockup" aria-label="Orbi"><span class="ring"></span><span class="word"></span></div>
    <div class="auth-head"><h1 id="auth-title"></h1><p id="auth-sub"></p></div>
    <div id="auth-panel" class="stack"></div>
    <p id="auth-switch" class="auth-switch"></p>
    <p class="legal">By continuing you agree to the Orbi terms and privacy policy.</p>
  </div>
</main>

<div id="app" hidden>
  <header class="topbar gx" id="topbar"></header>
  <div class="content" id="content">
    <section id="v-home" data-view="home">
      <div class="tray" id="tray" aria-label="Stories"></div>
      <div class="tabs2" role="tablist" aria-label="Feed">
        <button role="tab" data-feed="foryou" id="ft-foryou">For you</button>
        <button role="tab" data-feed="orbiting" id="ft-orbiting">Orbiting</button>
      </div>
      <div id="feed"></div>
    </section>

    <section id="v-explore" data-view="explore" hidden>
      <div class="xhead gx">
        <div id="xh-l" class="xhl"></div>
        <div class="search">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
          <label class="sr" for="search-in">Search Orbi</label>
          <input id="search-in" class="in" type="search" placeholder="Search" autocomplete="off">
        </div>
        <div id="xh-r" class="xhr"></div>
      </div>
      <div id="xtabs" class="xtabs" role="tablist" aria-label="Explore sections"></div>
      <div id="explore-body"></div>
    </section>

    <section id="v-reels" data-view="reels" hidden></section>

    <section id="v-alerts" data-view="alerts" hidden>
      <div class="pad gx"><h2 class="ttl">Alerts</h2></div>
      <div id="alerts-list"></div>
    </section>

    <section id="v-chat" data-view="chat" hidden>
      <div class="pad gx">
        <div class="search">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
          <label class="sr" for="chat-q">Search chats</label>
          <input id="chat-q" class="in" type="search" placeholder="Search" autocomplete="off">
        </div>
      </div>
      <div id="chat-list"></div>
    </section>

    <section id="v-requests" data-view="requests" hidden></section>

    <section id="v-newchat" data-view="newchat" hidden>
      <div class="pad gx">
        <div class="search">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
          <label class="sr" for="newchat-in">Search people</label>
          <input id="newchat-in" class="in" type="search" placeholder="Search people to message" autocomplete="off">
        </div>
        <div id="newchat-body"></div>
      </div>
    </section>

    <section id="v-thread" data-view="thread" hidden>
      <div id="thread-search" class="tsearch gx" hidden>
        <input id="thread-q" class="in" type="search" placeholder="Search this conversation" aria-label="Search this conversation" autocomplete="off">
        <button type="button" class="btn sm" data-act="tsearchoff">Done</button>
      </div>
      <div id="thread-msgs" class="msgs gx"></div>
      <div class="threadfoot">
      <div id="thread-reply" class="replybar gx" hidden></div>
      <form id="thread-form" class="msgbar gx" autocomplete="off">
        <button type="button" class="circ" data-act="tplus" aria-label="Add a photo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <label class="sr" for="thread-in">Message</label>
        <input id="thread-in" class="in" maxlength="1000" placeholder="Message">
        <button type="button" class="circ mic" id="thread-mic" data-act="tmic" aria-label="Record a voice message"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button type="submit" class="circ send" id="thread-send" aria-label="Send" disabled hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </form>
      <div id="thread-rec" class="msgbar recbar gx" hidden>
        <button type="button" class="circ" data-act="recx" aria-label="Cancel recording"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        <span class="recpill"><span class="recdot"></span><b id="rec-t">0:00</b><span class="recnote">Recording…</span></span>
        <button type="button" class="circ send" data-act="recsend" aria-label="Send voice message"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </div>
      <div id="thread-blocked" class="blockedbar gx" hidden></div>
      </div>
    </section>

    <section id="v-chatinfo" data-view="chatinfo" hidden></section>
    <section id="v-chatmedia" data-view="chatmedia" hidden></section>

    <section id="v-post" data-view="post" hidden></section>
    <section id="v-user" data-view="user" hidden></section>
    <section id="v-people" data-view="people" hidden></section>
    <section id="v-bookmarks" data-view="bookmarks" hidden></section>
    <section id="v-soon" data-view="soon" hidden></section>
    <section id="v-profile" data-view="profile" hidden></section>
    <section id="v-settings" data-view="settings" hidden></section>
    <section id="v-setpage" data-view="setpage" hidden></section>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <button class="fab round" id="fab2" data-act="newchat" hidden aria-label="New message"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="M18.5 3.5a2 2 0 0 1 3 3L12 16l-4 1 1-4z"/></svg></button>
  <button class="fab round" id="fab" data-act="create" hidden aria-label="Create an orb"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

  <div id="drawer" class="drawer" hidden>
    <div class="scrim" data-act="drawerclose"></div>
    <aside class="panel" role="dialog" aria-modal="true" aria-label="Menu" id="drawer-panel"></aside>
  </div>

  <div id="compose" class="compose" role="dialog" aria-modal="true" aria-label="Write an orb" hidden>
    <div class="compose-top gx">
      <button class="iconbtn cx-close" data-act="closecompose" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <span class="grow"></span>
      <button class="cx-drafts" id="cmp-drafts" data-act="cmpdrafts" hidden>Drafts</button>
      <button class="btn fill" id="composer-post" disabled>Orb</button>
    </div>
    <div id="cmp-ctx" class="gx"></div>
    <div class="compose-body gx">
      <div id="composer-av"></div>
      <div class="cbody">
        <button class="cx-aud" id="cmp-aud" data-act="cmpaud" type="button">Everyone<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <label class="sr" for="composer-text">Write an orb</label>
        <textarea id="composer-text" class="in" placeholder="What's happening?" rows="1"></textarea>
        <div id="cmp-media"></div>
        <div id="cmp-poll"></div>
        <div id="cmp-quote"></div>
      </div>
    </div>
    <div class="cmp-prog gx" id="cmp-progress" hidden><div class="bar"><i></i></div><span></span></div>
    <button class="cx-rep gx" id="cmp-rep" data-act="cmprep" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>Everyone can reply</span></button>
    <div class="cmp-tools gx" id="cmp-tools"></div>
  </div>

  <div id="creator" class="creator" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="story" class="story" hidden></div>
  <div id="lightbox" class="lightbox" hidden></div>
  <div id="sheet" class="sheetwrap" hidden></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filepick" hidden tabindex="-1" aria-hidden="true">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
