<body>

<div id="splash" class="gx" role="img" aria-label="Orbi">
  <div class="lockup"><span class="ring"></span><span class="word"></span></div>
  <div id="splash-err" class="errbox" hidden>
    <p id="splash-err-text"></p>
    <button class="abtn primary" id="splash-retry" style="width:auto;padding:0 28px">Try again</button>
  </div>
</div>

<main id="auth" class="gx" hidden>
  <div class="auth-inner">
    <div class="lockup" aria-label="Orbi"><span class="ring"></span><span class="word"></span></div>
    <div class="auth-head"><h1 id="auth-title"></h1><p id="auth-sub"></p></div>
    <div class="seg-auth" role="tablist" aria-label="Account">
      <button id="tab-signup" role="tab" data-mode="signup">Sign up</button>
      <button id="tab-login" role="tab" data-mode="login">Log in</button>
    </div>
    <div id="auth-panel" class="stack"></div>
    <p class="legal">By continuing you agree to the Orbi terms and privacy policy.</p>
  </div>
</main>

<div id="app" hidden>
  <header class="topbar gx" id="topbar"></header>
  <div class="content" id="content">
    <section id="v-home" data-view="home">
      <div class="tabs2" role="tablist" aria-label="Feed">
        <button role="tab" data-feed="foryou" id="ft-foryou">For you</button>
        <button role="tab" data-feed="orbiting" id="ft-orbiting">Orbiting</button>
      </div>
      <div class="composer gx">
        <div id="composer-av"></div>
        <div class="cbody">
          <div class="replychip" id="reply-chip" hidden></div>
          <label class="sr" for="composer-text">Write an orb</label>
          <textarea id="composer-text" class="in" placeholder="What's happening in your orbit?" rows="2"></textarea>
          <div class="crow"><span class="count" id="composer-count">0/280</span><button class="btn fill" id="composer-post" disabled>Orb</button></div>
        </div>
      </div>
      <div id="feed"></div>
    </section>

    <section id="v-explore" data-view="explore" hidden>
      <div class="pad gx">
        <div class="search">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
          <label class="sr" for="search-in">Search Orbi</label>
          <input id="search-in" class="in" type="search" placeholder="Search orbs and people" autocomplete="off">
        </div>
        <div id="explore-body"></div>
      </div>
    </section>

    <section id="v-alerts" data-view="alerts" hidden>
      <div class="pad gx"><h2 class="ttl">Alerts</h2></div>
      <div id="alerts-list"></div>
    </section>

    <section id="v-profile" data-view="profile" hidden></section>
    <section id="v-settings" data-view="settings" hidden></section>
    <section id="v-security" data-view="security" hidden></section>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
