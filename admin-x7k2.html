<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0705">
<title>Orbi Admin</title>
<style>
:root { --bg: #0c0705; --card: #1a0f09; --card2: #231410; --line: rgba(255,255,255,.1); --fg: #fff; --muted: rgba(255,255,255,.62); --accent: #ff8a3d; --accent-ink: #1b0f09; --danger: #ff5d6c; --ok: #4ade80; --warn: #fbbf24; }
@media (prefers-color-scheme: light) { :root { --bg: #fff7f1; --card: #fff; --card2: #fff1e6; --line: rgba(40,15,0,.12); --fg: #241208; --muted: rgba(36,18,8,.62); --accent: #e2570f; --accent-ink: #fff; --danger: #d7263d; --ok: #15803d; --warn: #b45309; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0); }
.bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; max-width: 1100px; margin: 0 auto; }
.logo { font-weight: 800; font-size: 18px; letter-spacing: .2px; }
.logo em { font-style: normal; color: var(--accent); }
.grow { flex: 1; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; height: 34px; padding: 0 14px; font-size: 13.5px; font-weight: 600; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 12px 8px; max-width: 1100px; margin: 0 auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; padding: 9px 14px; border-radius: 999px; font-weight: 600; font-size: 14.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.pill { background: var(--danger); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px 7px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 60px; }
h2 { margin: 6px 0 12px; font-size: 18px; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); } .grid.two { grid-template-columns: repeat(2, 1fr); } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.kpi b { display: block; font-size: 26px; line-height: 1.1; font-weight: 800; }
.kpi span { color: var(--muted); font-size: 12.5px; }
.kpi small { display: block; margin-top: 4px; font-size: 12px; color: var(--ok); }
.kpi.alert b { color: var(--danger); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.card h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.chart svg { width: 100%; height: 92px; display: block; }
.chart .lab { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 4px; }
.row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.av { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.mid { flex: 1; min-width: 0; }
.mid b { font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.txt { margin: 3px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); color: var(--muted); margin-right: 4px; text-transform: uppercase; letter-spacing: .3px; }
.tag.red { color: var(--danger); border-color: var(--danger); }
.tag.green { color: var(--ok); border-color: var(--ok); }
.tag.amber { color: var(--warn); border-color: var(--warn); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.btn { border: 1px solid var(--line); background: var(--card2); border-radius: 10px; height: 36px; padding: 0 14px; font-weight: 600; font-size: 13.5px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.bad { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn:disabled { opacity: .5; }
input.in, select.in, textarea.in { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; font-size: 15px; }
.tools { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.tools .in { flex: 1; min-width: 160px; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.thumb { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; background: var(--card2); margin: 4px 6px 0 0; }
.login { max-width: 380px; margin: 14vh auto 0; padding: 0 20px; display: grid; gap: 12px; }
.login h1 { margin: 0 0 4px; font-size: 24px; }
.err { color: var(--danger); font-size: 13.5px; min-height: 18px; margin: 0; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); border: 1px solid var(--line); border-radius: 20px 20px 0 0; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; padding: 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0)); }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h3 { margin: 0 0 6px; font-size: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.stats div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stats b { display: block; font-size: 18px; }
.stats span { color: var(--muted); font-size: 12px; }
.log { font-size: 13px; }
.msg { padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 80; max-width: 90vw; }
.loading { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var cfg = window.ORBI_CONFIG || {}, root = document.getElementById("root"), sb = null;
  var S = { tab: "overview", ov: null, users: [], uq: "", ckind: "orbs", cq: "", content: [], rstat: "open", reports: [], sstat: "open", support: [], audit: [], busy: false };
  var TABS = [["overview", "Overview"], ["growth", "Growth"], ["users", "Users"], ["content", "Content"], ["reports", "Reports"], ["support", "Support"], ["audit", "Audit log"]];

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function n(x) { return Number(x || 0).toLocaleString("en-US"); }
  function ago(iso) {
    if (!iso) return "never";
    var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago";
    if (s < 86400 * 30) return Math.floor(s / 86400) + "d ago";
    return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }
  function toast(m) { var t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
  function av(h, url) { return '<div class="av">' + (url ? '<img src="' + esc(url) + '" alt="">' : esc((h || "?").charAt(0).toUpperCase())) + "</div>"; }
  function mediaUrl(v) { return v && /^https?:/.test(v) ? v : ""; }

  /* ---------- small modal helpers ---------- */
  function modal(html) {
    var w = document.createElement("div"); w.className = "scrim"; w.innerHTML = '<div class="sheet">' + html + "</div>"; document.body.appendChild(w);
    w.addEventListener("click", function (e) { if (e.target === w) w.remove(); });
    return w;
  }
  function ask(title, text, o) {
    o = o || {};
    return new Promise(function (res) {
      var w = modal("<h3>" + esc(title) + '</h3><p class="sub">' + esc(text || "") + "</p>" + (o.input ? '<textarea class="in" id="ask-in" rows="2" placeholder="' + esc(o.input) + '"></textarea>' : "") +
        '<div class="acts"><button class="btn ' + (o.bad ? "bad" : "pri") + '" data-ok>' + esc(o.ok || "Confirm") + '</button><button class="btn" data-no>Cancel</button></div>');
      w.addEventListener("click", function (e) {
        if (e.target.closest("[data-ok]")) { var v = o.input ? w.querySelector("#ask-in").value.trim() : true; w.remove(); res(v === "" ? true : v); }
        else if (e.target.closest("[data-no]") || e.target === w) { w.remove(); res(null); }
      });
    });
  }
  async function rpc(name, args) {
    var r = await sb.rpc(name, args || {});
    if (r.error) { toast(r.error.message || "Something went wrong."); throw r.error; }
    return r.data;
  }

  /* ---------- sign in ---------- */
  function loginView(msg) {
    root.innerHTML = '<form class="login" id="lf"><div class="logo">orbi <em>admin</em></div><h1>Sign in</h1><p class="sub">Only accounts listed as admins can open this dashboard.</p>' +
      '<input class="in" id="em" type="email" placeholder="Email" autocomplete="email" required><input class="in" id="pw" type="password" placeholder="Password" autocomplete="current-password" required>' +
      '<p class="err" id="er">' + esc(msg || "") + '</p><button class="btn pri" style="height:46px;font-size:15px" type="submit">Sign in</button></form>';
    document.getElementById("lf").addEventListener("submit", async function (e) {
      e.preventDefault(); var er = document.getElementById("er"); er.textContent = "";
      var r = await sb.auth.signInWithPassword({ email: document.getElementById("em").value.trim(), password: document.getElementById("pw").value });
      if (r.error) { er.textContent = "Email or password is incorrect."; return; }
      start();
    });
  }
  async function start() {
    var s = await sb.auth.getSession();
    if (!s.data.session) return loginView();
    root.innerHTML = '<div class="loading">Checking access...</div>';
    var a = await sb.rpc("is_admin");
    if (a.error || a.data !== true) {
      await sb.auth.signOut();
      return loginView("This account is not an admin.");
    }
    shell(); go(S.tab);
  }

  /* ---------- shell ---------- */
  function shell() {
    root.innerHTML = '<div class="top"><div class="bar"><span class="logo">orbi <em>admin</em></span><span class="grow"></span><button class="ghost" id="rf">Refresh</button><button class="ghost" id="so">Sign out</button></div><div class="tabs" id="tabs" role="tablist"></div></div><main id="main"></main>';
    document.getElementById("rf").onclick = function () { go(S.tab, true); };
    document.getElementById("so").onclick = async function () { await sb.auth.signOut(); loginView(); };
    document.getElementById("tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });
    drawTabs();
  }
  function drawTabs() {
    var ov = S.ov || {};
    document.getElementById("tabs").innerHTML = TABS.map(function (t) {
      var b = t[0] === "reports" ? ov.reports_open : t[0] === "support" ? ov.support_open : 0;
      return '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + (b ? '<span class="pill">' + b + "</span>" : "") + "</button>";
    }).join("");
  }
  var timer = null;
  async function go(tab, force) {
    S.tab = tab; drawTabs(); clearInterval(timer);
    var m = document.getElementById("main"); m.innerHTML = '<div class="loading">Loading...</div>';
    try {
      if (tab !== "overview" && (force || !S.ov)) { S.ov = await rpc("admin_overview"); drawTabs(); }
      if (tab === "overview") { S.ov = await rpc("admin_overview"); drawTabs(); drawOverview(); timer = setInterval(async function () { if (S.tab !== "overview") return; try { S.ov = await rpc("admin_overview"); drawTabs(); drawOverview(); } catch (e) {} }, 60000); }
      else if (tab === "growth") { S.growth = await rpc("admin_growth"); drawGrowth(); }
      else if (tab === "users") { S.users = await rpc("admin_users", { p_q: S.uq, p_limit: 50, p_offset: 0 }); drawUsers(); }
      else if (tab === "content") { S.content = await rpc("admin_content", { p_kind: S.ckind, p_q: S.cq, p_limit: 50, p_offset: 0 }); drawContent(); }
      else if (tab === "reports") { S.reports = await rpc("admin_reports", { p_status: S.rstat }); drawReports(); }
      else if (tab === "support") { S.support = await rpc("admin_support", { p_status: S.sstat }); drawSupport(); }
      else if (tab === "audit") { S.audit = await rpc("admin_audit", { p_limit: 150 }); drawAudit(); }
    } catch (e) { m.innerHTML = '<div class="empty">Could not load this page. Press Refresh to try again.</div>'; }
  }

  /* ---------- overview ---------- */
  function chart(title, key, series) {
    var vals = series.map(function (d) { return Number(d[key]) || 0; }), max = Math.max.apply(null, vals.concat([1])), total = vals.reduce(function (a, b) { return a + b; }, 0);
    var w = 280, h = 80, bw = w / vals.length;
    var bars = vals.map(function (v, i) { var bh = Math.max(v ? 3 : 1, v / max * (h - 6)); return '<rect x="' + (i * bw + 2) + '" y="' + (h - bh) + '" width="' + (bw - 4) + '" height="' + bh + '" rx="2" fill="var(--accent)" opacity="' + (i === vals.length - 1 ? 1 : 0.55) + '"><title>' + esc(series[i].d) + ": " + v + "</title></rect>"; }).join("");
    return '<div class="card chart"><h3><span>' + title + "</span><span>" + n(total) + ' in 14 days</span></h3><svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img" aria-label="' + esc(title) + '">' + bars + '</svg><div class="lab"><span>' + esc(series[0].d.slice(5)) + "</span><span>today</span></div></div>";
  }
  function kpi(v, l, o) { o = o || {}; return '<div class="kpi' + (o.alert && v > 0 ? " alert" : "") + '"><b>' + n(v) + "</b><span>" + l + "</span>" + (o.sub ? "<small>" + o.sub + "</small>" : "") + "</div>"; }
  function drawOverview() {
    var o = S.ov, m = document.getElementById("main"); if (!o) return;
    var tagc = { signup: "green", orb: "", reel: "", report: "red", support: "amber" };
    m.innerHTML = "<h2>Overview</h2>" +
      '<div class="grid">' + kpi(o.users, "Total users", { sub: "+" + n(o.users_today) + " today" }) + kpi(o.users_7d, "New in 7 days") + kpi(o.active_24h, "Signed in last 24h") + kpi(o.active_7d, "Signed in last 7 days") +
      kpi(o.orbs, "Orbs") + kpi(o.reels, "Reels") + kpi(o.stories_live, "Live stories") + kpi(o.messages, "Messages sent") +
      kpi(o.likes, "Likes") + kpi(o.comments, "Reel comments") + kpi(o.orbits, "Orbits (follows)") + kpi(o.users_30d, "New in 30 days") +
      kpi(o.reports_open, "Open reports", { alert: 1 }) + kpi(o.support_open, "Open support requests", { alert: 1 }) + kpi(o.suspended, "Suspended accounts") + "</div>" +
      '<h2 style="margin-top:18px">Last 14 days</h2><div class="grid two">' + chart("New users", "users", o.series) + chart("Orbs posted", "orbs", o.series) + chart("Reels posted", "reels", o.series) + chart("Messages sent", "messages", o.series) + "</div>" +
      '<h2 style="margin-top:18px">Latest activity</h2><div class="card">' + ((o.recent || []).length ? o.recent.map(function (x) {
        return '<div class="row"><div class="mid"><span class="tag ' + (tagc[x.type] || "") + '">' + esc(x.type) + '</span><b>@' + esc(x.who) + '</b> <span class="sub">' + ago(x.at) + '</span><div class="txt">' + esc(x.text) + "</div></div></div>";
      }).join("") : '<div class="empty">Nothing yet.</div>') + "</div>" +
      '<p class="sub">Private chats are not shown here. Only a conversation that a user reports can be opened, from the Reports tab.</p>';
  }

  /* ---------- users ---------- */
  function drawUsers() {
    var m = document.getElementById("main");
    m.innerHTML = '<h2>Users</h2><div class="tools"><input class="in" id="uq" type="search" placeholder="Search name, handle or email" value="' + esc(S.uq) + '"><button class="btn pri" id="ugo">Search</button></div><div class="card" id="ul"></div>';
    document.getElementById("ul").innerHTML = S.users.length ? S.users.map(function (u) {
      return '<div class="row" data-user="' + u.id + '" style="cursor:pointer">' + av(u.handle, u.avatar_url) + '<div class="mid"><b>' + esc(u.display_name) + '</b> <span class="sub">@' + esc(u.handle) + "</span> " +
        (u.is_admin ? '<span class="tag green">admin</span>' : "") + (u.banned_at ? '<span class="tag red">suspended</span>' : "") + (u.reports_open ? '<span class="tag amber">' + u.reports_open + " open report" + (u.reports_open > 1 ? "s" : "") + "</span>" : "") +
        '<div class="sub">' + esc(u.email) + '</div><div class="sub">Joined ' + ago(u.created_at) + " · last sign-in " + ago(u.last_sign_in_at) + " · " + n(u.orbs) + " orbs · " + n(u.reels) + " reels · " + n(u.messages) + " messages</div></div></div>";
    }).join("") : '<div class="empty">No users found.</div>';
    var q = document.getElementById("uq");
    function run() { S.uq = q.value.trim(); go("users"); }
    document.getElementById("ugo").onclick = run; q.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
    document.getElementById("ul").addEventListener("click", function (e) { var r = e.target.closest("[data-user]"); if (r) userSheet(r.dataset.user); });
  }
  async function userSheet(id) {
    var d; try { d = await rpc("admin_user_detail", { p_id: id }); } catch (e) { return; }
    if (!d) return toast("User not found.");
    var w = modal("");
    function draw() {
      w.querySelector(".sheet").innerHTML = '<div class="row" style="border:0;padding-top:0">' + av(d.handle, d.avatar_url) + '<div class="mid"><h3>' + esc(d.display_name) + '</h3><div class="sub">@' + esc(d.handle) + " · " + esc(d.email) + "</div>" +
        (d.is_admin ? '<span class="tag green">admin</span>' : "") + (d.banned_at ? '<span class="tag red">suspended ' + ago(d.banned_at) + "</span>" : '<span class="tag green">active</span>') + "</div></div>" +
        (d.bio ? '<p class="txt">' + esc(d.bio) + "</p>" : "") + '<div class="sub">' + [d.location, d.website].filter(Boolean).map(esc).join(" · ") + "</div>" +
        '<div class="stats"><div><b>' + n(d.orbs) + "</b><span>Orbs</span></div><div><b>" + n(d.reels) + "</b><span>Reels</span></div><div><b>" + n(d.stories) + "</b><span>Stories</span></div><div><b>" + n(d.followers) + "</b><span>Followers</span></div><div><b>" + n(d.following) + "</b><span>Following</span></div><div><b>" + n(d.messages) + "</b><span>Messages</span></div></div>" +
        '<div class="sub">Joined ' + ago(d.created_at) + " · last sign-in " + ago(d.last_sign_in_at) + " · reports against: " + n(d.reports_against) + " · reports filed: " + n(d.reports_filed) + "</div>" +
        (d.banned_at && d.ban_reason ? '<p class="sub">Reason: ' + esc(d.ban_reason) + "</p>" : "") +
        (d.is_admin ? "" : '<div class="acts">' + (d.banned_at ? '<button class="btn pri" data-unban>Lift suspension</button>' : '<button class="btn bad" data-ban>Suspend account</button>') + "</div>") +
        (d.reports.length ? "<h3 style='margin-top:16px'>Reports</h3>" + d.reports.map(function (r) { return '<div class="msg"><span class="tag ' + (r.status === "open" ? "amber" : "") + '">' + esc(r.status) + "</span><span class=\"tag\">" + esc(r.kind) + "</span> " + esc(r.reason || "No reason given") + ' <span class="sub">' + ago(r.created_at) + "</span></div>"; }).join("") : "") +
        (d.recent_orbs.length ? "<h3 style='margin-top:16px'>Recent orbs</h3>" + d.recent_orbs.map(function (o) { return '<div class="msg">' + esc(o.body || "(media only)") + ' <span class="sub">' + ago(o.created_at) + '</span> <button class="btn bad" style="height:28px" data-del-orb="' + o.id + '">Remove</button></div>'; }).join("") : "") +
        (d.recent_reels.length ? "<h3 style='margin-top:16px'>Recent reels</h3>" + d.recent_reels.map(function (o) { return '<div class="msg">' + (mediaUrl(o.poster_url) ? '<img class="thumb" src="' + esc(o.poster_url) + '" alt="">' : "") + esc(o.caption || "(no caption)") + ' <span class="sub">' + ago(o.created_at) + '</span> <a class="sub" href="' + esc(o.video_url) + '" target="_blank" rel="noopener">Open video</a> <button class="btn bad" style="height:28px" data-del-reel="' + o.id + '">Remove</button></div>'; }).join("") : "") +
        '<div class="acts" style="margin-top:16px"><button class="btn" data-close>Close</button></div>';
    }
    draw();
    w.addEventListener("click", async function (e) {
      if (e.target.closest("[data-close]")) { w.remove(); return; }
      try {
        if (e.target.closest("[data-ban]")) {
          var why = await ask("Suspend @" + d.handle + "?", "They will still be able to log in and read, but they cannot post, comment, send messages or add stories.", { input: "Reason (kept in the audit log)", ok: "Suspend", bad: 1 });
          if (why === null) return;
          await rpc("admin_set_ban", { p_user: d.id, p_banned: true, p_reason: typeof why === "string" ? why : null }); d.banned_at = new Date().toISOString(); d.ban_reason = typeof why === "string" ? why : null; draw(); toast("Account suspended.");
        } else if (e.target.closest("[data-unban]")) {
          await rpc("admin_set_ban", { p_user: d.id, p_banned: false, p_reason: null }); d.banned_at = null; draw(); toast("Suspension lifted.");
        } else if (e.target.closest("[data-del-orb]")) { var b = e.target.closest("[data-del-orb]"); if (await removeItem("orbs", b.dataset.delOrb, "orb", d.handle)) { d.recent_orbs = d.recent_orbs.filter(function (x) { return x.id !== b.dataset.delOrb; }); draw(); }
        } else if (e.target.closest("[data-del-reel]")) { var b2 = e.target.closest("[data-del-reel]"); if (await removeItem("reels", b2.dataset.delReel, "reel", d.handle)) { d.recent_reels = d.recent_reels.filter(function (x) { return x.id !== b2.dataset.delReel; }); draw(); } }
      } catch (err) {}
    });
  }
  async function removeItem(table, id, label, handle) {
    var ok = await ask("Remove this " + label + "?", "It is deleted for everyone and cannot be undone.", { ok: "Remove", bad: 1 });
    if (!ok) return false;
    var r = await sb.from(table).delete().eq("id", id).select("id");
    if (r.error || !r.data || !r.data.length) { toast(r.error ? r.error.message : "Nothing was removed."); return false; }
    sb.rpc("admin_log_action", { p_action: "remove_" + label, p_target: id, p_detail: { author: handle || null } });
    toast("Removed."); return true;
  }

  /* ---------- content ---------- */
  function drawContent() {
    var m = document.getElementById("main");
    m.innerHTML = '<h2>Content</h2><div class="tools"><div class="seg" id="ck">' + [["orbs", "Orbs"], ["reels", "Reels"], ["comments", "Comments"]].map(function (k) { return '<button data-k="' + k[0] + '" aria-pressed="' + (S.ckind === k[0]) + '">' + k[1] + "</button>"; }).join("") +
      '</div><input class="in" id="cq" type="search" placeholder="Search text or @handle" value="' + esc(S.cq) + '"><button class="btn pri" id="cgo">Search</button></div><div class="card" id="cl"></div>';
    document.getElementById("cl").innerHTML = S.content.length ? S.content.map(function (c) {
      var media = "";
      if (c.kind === "orb" && Array.isArray(c.media)) media = c.media.slice(0, 4).map(function (x) { return x && x.type === "image" && mediaUrl(x.url) ? '<img class="thumb" src="' + esc(x.url) + '" alt="">' : x && x.type === "video" ? '<a class="tag" href="' + esc(x.url) + '" target="_blank" rel="noopener">video</a>' : ""; }).join("");
      if (c.kind === "reel") media = (mediaUrl(c.poster_url) ? '<img class="thumb" src="' + esc(c.poster_url) + '" alt="">' : "") + '<a class="tag" href="' + esc(c.video_url) + '" target="_blank" rel="noopener">open video</a>';
      return '<div class="row"><div class="mid"><span class="tag">' + esc(c.kind) + '</span>' + (c.sensitive ? '<span class="tag amber">sensitive</span>' : "") + '<b>@' + esc(c.handle) + '</b> <span class="sub">' + ago(c.created_at) + '</span><div class="txt">' + esc(c.text || "(no text)") + "</div>" + media +
        '<div class="acts"><button class="btn bad" data-rm="' + c.id + '" data-kind="' + c.kind + '">Remove</button><button class="btn" data-usr="' + c.author_id + '">View user</button></div></div></div>';
    }).join("") : '<div class="empty">Nothing here yet.</div>';
    document.getElementById("ck").onclick = function (e) { var b = e.target.closest("[data-k]"); if (b) { S.ckind = b.dataset.k; go("content"); } };
    var q = document.getElementById("cq"); function run() { S.cq = q.value.trim(); go("content"); }
    document.getElementById("cgo").onclick = run; q.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
    document.getElementById("cl").addEventListener("click", async function (e) {
      var u = e.target.closest("[data-usr]"); if (u) return userSheet(u.dataset.usr);
      var r = e.target.closest("[data-rm]"); if (!r) return;
      var tbl = { orb: "orbs", reel: "reels", comment: "reel_comments" }[r.dataset.kind];
      var item = S.content.filter(function (x) { return x.id === r.dataset.rm; })[0];
      if (await removeItem(tbl, r.dataset.rm, r.dataset.kind, item && item.handle)) { S.content = S.content.filter(function (x) { return x.id !== r.dataset.rm; }); drawContent(); }
    });
  }

  /* ---------- reports ---------- */
  function drawReports() {
    var m = document.getElementById("main");
    m.innerHTML = '<h2>Reports</h2><div class="tools"><div class="seg" id="rs">' + [["open", "Open"], ["actioned", "Actioned"], ["dismissed", "Dismissed"], ["all", "All"]].map(function (k) { return '<button data-s="' + k[0] + '" aria-pressed="' + (S.rstat === k[0]) + '">' + k[1] + "</button>"; }).join("") + '</div></div><div class="card" id="rl"></div>';
    document.getElementById("rl").innerHTML = S.reports.length ? S.reports.map(function (r) {
      var p = r.preview || {}, pv = "";
      if (r.kind === "orb" || r.kind === "reel") pv = r.preview ? '<div class="txt" style="background:var(--card2);padding:8px 10px;border-radius:10px">' + esc(p.text || "(no text)") + "</div>" + (r.kind === "reel" && p.video_url ? '<a class="sub" href="' + esc(p.video_url) + '" target="_blank" rel="noopener">Open video</a>' : "") : '<div class="sub">This content has already been removed.</div>';
      else if (r.kind === "user") pv = '<div class="sub">Profile bio: ' + esc(p.text || "(empty)") + "</div>";
      else pv = '<div class="sub">Reported conversation. You can read the recent messages between these two people.</div>';
      return '<div class="row"><div class="mid"><span class="tag ' + (r.status === "open" ? "amber" : "") + '">' + esc(r.status) + '</span><span class="tag red">' + esc(r.kind) + '</span><span class="sub">' + ago(r.created_at) + '</span>' +
        '<div class="sub">Reported by <b>@' + esc(r.reporter) + "</b> against <b>@" + esc(r.target) + "</b></div><div class=\"txt\"><b>Reason:</b> " + esc(r.reason || "No reason given") + "</div>" + pv + (r.note ? '<div class="sub">Admin note: ' + esc(r.note) + "</div>" : "") +
        '<div class="acts">' +
        (r.kind === "conversation" ? '<button class="btn" data-conv="' + r.id + '">Read messages</button>' : "") +
        ((r.kind === "orb" || r.kind === "reel") && r.preview ? '<button class="btn bad" data-rmc="' + r.id + '">Remove ' + r.kind + "</button>" : "") +
        '<button class="btn" data-usr="' + r.target_id + '">View user</button>' +
        (r.status === "open" ? '<button class="btn pri" data-res="' + r.id + '" data-st="actioned">Mark actioned</button><button class="btn" data-res="' + r.id + '" data-st="dismissed">Dismiss</button>' : '<button class="btn" data-res="' + r.id + '" data-st="open">Reopen</button>') + "</div></div></div>";
    }).join("") : '<div class="empty">No reports here. Nice and quiet.</div>';
    document.getElementById("rs").onclick = function (e) { var b = e.target.closest("[data-s]"); if (b) { S.rstat = b.dataset.s; go("reports"); } };
    document.getElementById("rl").addEventListener("click", async function (e) {
      var b;
      try {
        if ((b = e.target.closest("[data-usr]"))) return userSheet(b.dataset.usr);
        if ((b = e.target.closest("[data-conv]"))) {
          var msgs = await rpc("admin_report_conversation", { p_id: b.dataset.conv });
          var w = modal("<h3>Reported conversation</h3><p class=\"sub\">Showing the last " + msgs.length + " messages between the two people. Opened by an admin because it was reported.</p>" + (msgs.length ? msgs.map(function (x) { return '<div class="msg"><b>@' + esc(x.sender) + '</b> <span class="sub">' + ago(x.created_at) + "</span><div class=\"txt\">" + esc(x.body || (x.media_url ? "(media)" : "")) + "</div></div>"; }).join("") : '<div class="empty">No messages found.</div>') + '<div class="acts"><button class="btn" data-x>Close</button></div>');
          w.addEventListener("click", function (ev) { if (ev.target.closest("[data-x]")) w.remove(); });
          sb.rpc("admin_log_action", { p_action: "read_reported_conversation", p_target: b.dataset.conv });
          return;
        }
        if ((b = e.target.closest("[data-rmc]"))) {
          var r = S.reports.filter(function (x) { return x.id === b.dataset.rmc; })[0];
          if (await removeItem(r.kind === "orb" ? "orbs" : "reels", r.ref_id, r.kind, r.target)) { await rpc("admin_set_report", { p_id: r.id, p_status: "actioned", p_note: "Content removed" }); go("reports"); }
          return;
        }
        if ((b = e.target.closest("[data-res]"))) {
          var note = b.dataset.st === "open" ? null : await ask(b.dataset.st === "actioned" ? "Mark as actioned?" : "Dismiss this report?", "", { input: "Optional note", ok: b.dataset.st === "actioned" ? "Mark actioned" : "Dismiss" });
          if (note === null && b.dataset.st !== "open") return;
          await rpc("admin_set_report", { p_id: b.dataset.res, p_status: b.dataset.st, p_note: typeof note === "string" ? note : null }); go("reports", true);
        }
      } catch (err) {}
    });
  }

  /* ---------- support ---------- */
  function drawSupport() {
    var m = document.getElementById("main");
    m.innerHTML = '<h2>Support requests</h2><div class="tools"><div class="seg" id="ss">' + [["open", "Open"], ["resolved", "Resolved"], ["all", "All"]].map(function (k) { return '<button data-s="' + k[0] + '" aria-pressed="' + (S.sstat === k[0]) + '">' + k[1] + "</button>"; }).join("") + '</div></div><div class="card" id="sl"></div>';
    document.getElementById("sl").innerHTML = S.support.length ? S.support.map(function (s) {
      return '<div class="row"><div class="mid"><span class="tag ' + (s.resolved_at ? "green" : "amber") + '">' + (s.resolved_at ? "resolved" : "open") + '</span><span class="tag">' + esc(s.topic) + '</span><span class="sub">' + ago(s.created_at) + '</span><div><b>' + esc(s.subject || "(no subject)") + '</b></div><div class="txt">' + esc(s.message) + '</div><div class="sub">From @' + esc(s.handle || "unknown") + " · " + esc(s.email || "") + '</div><div class="acts">' +
        (s.email ? '<a class="btn" style="display:inline-grid;place-items:center;text-decoration:none" href="mailto:' + esc(s.email) + "?subject=" + encodeURIComponent("Re: " + (s.subject || "Your Orbi support request")) + '">Reply by email</a>' : "") +
        '<button class="btn ' + (s.resolved_at ? "" : "pri") + '" data-sr="' + s.id + '" data-v="' + (s.resolved_at ? "0" : "1") + '">' + (s.resolved_at ? "Reopen" : "Mark resolved") + "</button></div></div></div>";
    }).join("") : '<div class="empty">No support requests.</div>';
    document.getElementById("ss").onclick = function (e) { var b = e.target.closest("[data-s]"); if (b) { S.sstat = b.dataset.s; go("support"); } };
    document.getElementById("sl").addEventListener("click", async function (e) {
      var b = e.target.closest("[data-sr]"); if (!b) return;
      try { await rpc("admin_set_support", { p_id: b.dataset.sr, p_resolved: b.dataset.v === "1" }); go("support", true); } catch (er) {}
    });
  }

  /* ---------- growth ---------- */
  function pct(a, b) { return b ? Math.round(a / b * 100) + "%" : "-"; }
  function drawGrowth() {
    var g = S.growth, m = document.getElementById("main"); if (!g) return;
    var f = g.funnel || {}, iv = g.invites || {}, ev = g.events_7d || {};
    var dau = (g.dau || []).map(function (x) { return { d: x.d, dau: x.n }; });
    m.innerHTML = "<h2>Growth</h2>" +
      '<p class="sub">Usage is counted from the day this version went live. Retention shows the share of each signup day who opened the app again on day 1 and day 7.</p>' +
      '<div class="grid">' + kpi(f.signups_30d, "Signups, 30 days") + kpi(f.posted, "Posted something", { sub: pct(f.posted, f.signups_30d) + " of signups" }) + kpi(f.followed, "Orbited someone", { sub: pct(f.followed, f.signups_30d) + " of signups" }) + kpi(f.welcome_done, "Finished welcome", { sub: pct(f.welcome_done, f.signups_30d) + " of signups" }) +
      kpi(iv.total, "People joined by invite", { sub: "+" + n(iv.last_7d) + " in 7 days" }) + kpi(ev.app_open || 0, "App opens, 7 days") + kpi(ev.post || 0, "Orbs posted, 7 days") + kpi(ev.invite_share || 0, "Invite shares, 7 days") + "</div>" +
      '<h2 style="margin-top:18px">Daily active users</h2>' + (dau.length ? chart("Daily active", "dau", dau) : "") +
      '<h2 style="margin-top:18px">Retention by signup day</h2><div class="card">' + ((g.cohorts || []).length ? (g.cohorts).map(function (c) {
        return '<div class="row"><div class="mid"><b>' + esc(c.d) + '</b> <span class="sub">' + n(c.size) + ' signed up</span></div><div><span class="tag">Day 1: ' + pct(c.d1, c.size) + '</span><span class="tag">Day 7: ' + pct(c.d7, c.size) + "</span></div></div>";
      }).join("") : '<div class="empty">No signups in the last 14 days.</div>') + "</div>" +
      '<h2 style="margin-top:18px">Top inviters</h2><div class="card">' + ((iv.top || []).length ? iv.top.map(function (t) {
        return '<div class="row"><div class="mid"><b>@' + esc(t.handle) + '</b></div><span class="tag green">' + n(t.n) + " joined</span></div>";
      }).join("") : '<div class="empty">No invites used yet.</div>') + "</div>";
  }

  /* ---------- audit ---------- */
  function drawAudit() {
    var m = document.getElementById("main");
    m.innerHTML = '<h2>Audit log</h2><p class="sub">Every admin action (suspensions, removals, report decisions) is recorded here.</p><div class="card log" id="al"></div>';
    document.getElementById("al").innerHTML = S.audit.length ? S.audit.map(function (a) {
      return '<div class="row"><div class="mid"><span class="tag">' + esc(a.action.replace(/_/g, " ")) + '</span><b>@' + esc(a.admin || "admin") + '</b> <span class="sub">' + ago(a.created_at) + "</span>" + (a.target ? '<div class="sub">Target: ' + esc(a.target) + "</div>" : "") + (a.detail && Object.keys(a.detail).length ? '<div class="sub">' + esc(JSON.stringify(a.detail)) + "</div>" : "") + "</div></div>";
    }).join("") : '<div class="empty">No admin actions yet.</div>';
  }

  /* ---------- boot ---------- */
  function boot() {
    if (!window.supabase || !cfg.url) { root.innerHTML = '<div class="empty">Could not load. Check your connection and refresh.</div>'; return; }
    sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
    start();
  }
  boot();
})();
</script>
</body>
</html>
